# =====================================================================
#  Slot Reelset Optimizer - Configuration
#  Edit the values below, then run (from the "Math Optimization" folder):
#      python Optimizer/main.py GA-config.yaml
#  Lines starting with # are comments and are ignored.
# =====================================================================

# ---------------------------------------------------------------------
#  RUN SETTINGS
# ---------------------------------------------------------------------
run:
  # Runs to execute. The whole experiment sweep below is repeated once per
  # run number, and each run is saved under its own seed_<n> in resultFile.
  # The run number IS the random seed: the same number + the same settings
  # always reproduces exactly the same results.
  #   runNumbers: [1, 2, 3]        explicit list (easy to re-create one run later)
  #   runNumbers: "1-30"           range, same as [1, 2, ..., 30]
  #   runNumbers: [1-10, 50]       ranges and numbers mixed
  # To re-create a single run later: runNumbers: [7]  (same settings as before)
  runNumbers: [1]

  # How many generations to evolve (SteadyState uses this number directly;
  # Generational uses generations/populationSize,
  # ElistismGenerational uses generations/(populationSize-2)).
  generations: 1000

  # true  = generate new random parents for each run (seeded by the run number,
  #         so the same run number always generates the same parents)
  # false = reuse existing parents, checked in this order:
  #           1. resultFile -> seed_<runNumber> -> initial_population
  #           2. paths.seedParentsFile
  #         if neither is found, new random parents are created automatically.
  createNewParents: true

  # Number of reelsets (parents) in the population.
  populationSize: 10

  # Spins per simulation. More = more accurate but slower.
  # Changing this changes every result, so keep it fixed across runs you compare.
  #   100_000      quick test
  #   10_000_000   normal tuning
  spins: 10_000_000

  # Which part of the game to tune.
  # Options: BaseGame, FreeGame
  gameMode: FreeGame

  # After each experiment, re-test the best reelset with this many spins
  # and print its stats. 0 = skip (faster). 100_000_000 = high-accuracy check.
  finalCheckSpins: 300_000_000

# ---------------------------------------------------------------------
#  FREE GAME TUNING (only used when run.gameMode is FreeGame)
#  The base-game reels are kept FIXED and only the free-game reels evolve.
#  Every parent gets the same base reels, so they are compared fairly.
#
#  Usual workflow:
#    1. gameMode: BaseGame, runNumbers: [1-5] -> results saved under seed_1 ... seed_5
#    2. gameMode: FreeGame, runNumbers: [1-5] -> run n reads its base reels from seed_n,
#                                                 saves its results under seed_n_free
# ---------------------------------------------------------------------
freeGame:
  # Where the fixed base reels come from:
  #   same   : for each combination (mutation + replacement + selection), use the
  #            best base reels that SAME combination found in the BaseGame run
  #            with the same run number. Every combination must exist there.
  #   manual : one reelset file (baseReelFile), used for every combination
  baseReelSource: same

  # manual: a file holding a single parent's reelset. Same format as the
  # parent files in TempParents, or { "BaseGameReel": [[...], ...] }
  baseReelFile: Optimizer/ReelSets/fixed_base.json

# ---------------------------------------------------------------------
#  EXPERIMENTS - every combination below is run one after another,
#  once per run number
# ---------------------------------------------------------------------
experiments:
  # Options: Generational, SteadyState, ElistismGenerational
  replacementTypes:
    - Generational
    - SteadyState
    - ElistismGenerational

  # Options: RouletteSelection, TournamentSelection, SUS
  selectionTypes:
    - RouletteSelection
    - TournamentSelection
    - SUS

  # How many reel positions are changed per mutation.
  # Reel length is 50, so 5 = 10%, 10 = 20%, 15 = 30%.
  mutationCounts: [5]

# ---------------------------------------------------------------------
#  REEL LAYOUT
# ---------------------------------------------------------------------
reels:
  # All symbols that can appear on a reel. WD = wild, SC = scatter.
  symbols: [AA, BB, CC, DD, EE, FF, GG, WD, SC]

  # Number of stops on each reel strip.
  reelSize: 50

  # Number of reels (columns).
  columnCount: 5

# ---------------------------------------------------------------------
#  FITNESS GOALS - what the optimizer tries to hit, one list per gameMode.
#  Only the list matching run.gameMode is used.
#    type    : the statistic to optimize
#    target  : the value you want
#    weight  : importance; higher = optimizer cares more
#    enabled : true to use this goal, false to ignore it
#
#  Types: baseRTP, baseHitRate, freeRTP, freeHitRate,
#         freeTriggerRate, freeRetriggerRate
#  Note: in BaseGame mode the simulator runs the base game only, so free-game
#        goals other than freeTriggerRate don't make sense there.
# ---------------------------------------------------------------------
fitnessVariables:
  BaseGame:
    - { type: baseRTP, target: 0.57, weight: 10, enabled: true }
    - { type: baseHitRate, target: 3, weight: 6, enabled: true }
    - { type: freeTriggerRate, target: 80, weight: 3, enabled: true }

  FreeGame:
    - { type: freeRTP, target: 0.38, weight: 10, enabled: true }
    - { type: freeHitRate, target: 2.7, weight: 6, enabled: true }
    - { type: freeRetriggerRate, target: 60, weight: 3, enabled: true }

# ---------------------------------------------------------------------
#  PATHS (relative to the "Math Optimization" folder)
# ---------------------------------------------------------------------
paths:
  tempParentsFolder: Optimizer/ReelSets/TempParents
  initialParentsFolder: Optimizer/ReelSets/InitialParents
  seedParentsFile: Optimizer/ReelSets/seed_parents.json
  resultFile: Results/results.json
  simulatorPath: build/simulator
